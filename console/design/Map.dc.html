<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature map</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/fonts.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/colors.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/typography.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/spacing.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/effects.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/base.css">
<script src="ds/caphedesignsystem_e679e3/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--text-accent)}a:hover{color:var(--accent-hover)}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--bg-page); font-family: var(--font-sans); color: var(--text-body);">
  <div style="flex: 1 1 248px; max-width: 100%;">
    <dc-import name="Sidebar" active="map" hint-size="248px,1100px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 48px clamp(20px, 4vw, 56px) 64px; display: flex; flex-direction: column; gap: 32px;">
    <header style="display: flex; flex-direction: column; gap: 12px; max-width: 760px;">
      <x-import component-from-global-scope="CaPheDesignSystem_e679e3.Eyebrow" items="{{eyebrow}}"></x-import>
      <h1 style="font: var(--type-h1); letter-spacing: var(--tracking-heading);">Where everything went.</h1>
      <p style="font: var(--type-body-l); color: var(--text-muted);">Every place in the old station menus and every company tool, and the screen that now holds it.</p>
    </header>

    <div role="tablist" aria-label="Source" style="display: flex; gap: 4px; border-bottom: 1px solid var(--border-hairline);">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}} <span style="font: 400 12px/1 var(--font-mono); color: var(--text-subtle);">{{t.n}}</span></button>
      </sc-for>
    </div>

    <div style="overflow-x: auto; border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); background: var(--surface-card);">
      <table style="width: 100%; min-width: 760px; border-collapse: collapse; font: var(--type-body-s);">
        <thead><tr style="text-align: left;">
          <th scope="col" style="padding: 14px 18px; font: var(--type-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-muted);">{{h1}}</th>
          <th scope="col" style="padding: 14px 18px; font: var(--type-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-muted);">Now in</th>
          <th scope="col" style="padding: 14px 18px; font: var(--type-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-muted);">{{h3}}</th>
        </tr></thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
            <tr style="border-top: 1px solid var(--border-hairline);">
              <td style="padding: 12px 18px; color: var(--text-strong); font: var(--type-label);">{{r.from}}</td>
              <td style="padding: 12px 18px; white-space: nowrap;"><a href="{{r.href}}">{{r.to}}</a></td>
              <td style="padding: 12px 18px; font: var(--type-mono); color: var(--text-muted);">{{r.src}}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'station' }; }
  renderVals() {
    const tab = this.state.tab;
    const S = { Controls: 'Controls.dc.html', Halt: 'Halt.dc.html', Today: 'Main.dc.html', Comms: 'Comms.dc.html', Crew: 'Crew.dc.html', Work: 'Work.dc.html', Automate: 'Automate.dc.html', Hiring: 'Hiring.dc.html', Governance: 'Governance.dc.html', Usage: 'Usage.dc.html', Floor: 'Floor.dc.html', Abilities: 'Abilities.dc.html', System: 'System.dc.html' };
    const row = (from, to, src) => ({ from, to: to.replace(/ ›.*/, '') === to ? to : to, href: S[to.split(' ›')[0]], src });
    const station = [
      row('Station floor, cinema, HUD', 'Floor', 'state/snapshot · observe'),
      row('Build mode, props, community maps', 'Floor › Build mode', 'userprops/* · community-maps/*'),
      row('Crew › Agents (dossier tabs)', 'Crew', 'insights · memory/* · checkpoint/*'),
      row('Crew › Recruit, prospects', 'Crew › Recruit', 'roster · scout/*'),
      row('Crew › You', 'System › You', 'dossier · goals · journey'),
      row('Crew › Step-in', 'Crew › Step in', 'browser/handoff/*'),
      row('Comms chat, slash commands, steer, stop', 'Comms', 'run · run/steer · slash/*'),
      row('Group DMs, delegated workers', 'Comms', 'groups · subagents/*'),
      row('Needs you, consent decks, run recovery', 'Today › Needs you', 'consent/* · run-recoveries/*'),
      row('Sessions ↔ Projects', 'Comms › Sessions / Projects', 'projects/* · lineage/*'),
      row('Work › My work: tasks, deliverables, to review', 'Work', 'deliverables/* · line-jobs'),
      row('Work › Recipes', 'Work › Recipes', 'recipes/*'),
      row('Automate › Workflows (conveyor lines)', 'Automate › Workflows', 'routing/* · line-jobs/*'),
      row('Automate › Schedules', 'Automate', 'cron/*'),
      row('Automate › Goal loops', 'Automate › Goal loops', 'loops/*'),
      row('Automate › Away work, night shift', 'Automate › Away work', 'workshop/* · nightshift/*'),
      row('Quests, progress, trophy case', 'Work › Quests', 'quests/* · journey'),
      row('Learning: study, threads, recommendations', 'Crew › Growth', 'study/* · threads/* · recommendations/*'),
      row('Connect › Abilities: apps, connected, tools', 'Abilities', 'connectors/* · toolsets/*'),
      row('Connect › API keys, computer control', 'Abilities › API keys / Tools', 'servicekeys/* · computer-control'),
      row('Connect › Skills, skill market, learned skills', 'Abilities › Skills', 'skills/* · agent-skills/* · skill-market/*'),
      row('Connect › Channels', 'Abilities › Channels', 'channels/*'),
      row('Apps › New app, manage apps', 'Abilities › Apps', 'apps/*'),
      row('Browser, saved sign-ins', 'Abilities › Browser', 'browser/*'),
      row('Settings › AI and models, model dock, fallback', 'Usage', 'providers/* · model-tiers · fallback/chain'),
      row('Settings › Spending limits, top-bar spend', 'Usage / System', 'budget/* · usage/providers'),
      row('Settings › Autonomy, permissions, halt', 'Governance › Autonomy', 'autonomy/* · permissions/* · halt'),
      row('Settings › Look and sound, alerts, voice', 'System', 'stt/* · tts/* · realtime/*'),
      row('Settings › Remote', 'System', 'remote/*'),
      row('Settings › App and backup, updates, diagnostics', 'System', 'config/* · recovery/* · update/*'),
      row('Widgets', 'Today (pinnable cards)', 'widgets/*'),
      row('Field manual, notifications', 'System', 'version · health')
    ];
    const company = [
      row('Owner questions (gates)', 'Today › Needs you', 'inbox.js · ask.js'),
      row('Owner inbox and addressing', 'Comms › Owner channel', 'owner-inbox.js · owner-addressing.js'),
      row('Dispatcher state', 'Automate', 'dispatch.js · dispatch-state.json'),
      row('Handoffs', 'Work › Handoffs', 'handoff-status.js · handoff-archive.js'),
      row('Decisions log', 'Work › Decisions', 'work/decisions.md'),
      row('Projects (ownership)', 'Work › Projects', 'project.js'),
      row('Seats and functions', 'Crew', 'loops.json · lib/company.js'),
      row('Hiring rounds, seat templates', 'Hiring', 'hire.js · roles/templates/'),
      row('Competence, performance, 1-on-1s', 'Crew › Competence', 'competence.js · performance.js · corrections.js'),
      row('Own prompt section', 'Crew › Own section', 'my-section.js'),
      row('Shared changes', 'Governance', 'harness-change.js'),
      row('Escalations, mandates', 'Governance', 'escalate.js · mandate.js'),
      row('External-action gate', 'Governance', 'external-gate.js'),
      row('Locked files, connector scope', 'Governance', 'locked-watch.js · connector-scope.js'),
      row('Merge gate, default-branch watch', 'Governance', 'merge-gate.js · default-branch-watch.js'),
      row('AI usage pacer, shared accounts', 'Usage', 'pacer.js · pacing-policy.json'),
      row('Metered cap', 'Usage / System', 'cap-numerator.js · dispatch-budget.json'),
      row('Off-peak hold', 'Usage', 'offpeak-*.js'),
      row('Model benchmarks, drift, routine fit', 'Usage', 'model-stats.js · model-drift.js · routine-length.js'),
      row('Skill review (HR)', 'Abilities › Skills', 'skills-hr.js'),
      row('Floor audit, desks', 'Floor', 'station-floor.js'),
      row('Station view (screenshots)', 'Floor › Snapshot', 'station-view.js'),
      row('Health, incidents, tool integrity', 'System › Health', 'health-check.sh · tool-parse.js · quest-audit.js'),
      row('Self-governance levels and presets (new)', 'Controls', 'governance.js · state/governance.json'),
      row('Guardrail switches, no-guardrails mode (new)', 'Controls › Guardrails', 'guardrails.js · state/guardrails.json'),
      row('Dispatcher tick and per-seat cadence (new)', 'Controls › Ticks and cadence', 'cadence.js · work/ops/cadence.json'),
      row('Soft halt with shutdown procedures, hard halt (new)', 'Halt', 'halt.js · state/halt.json · /api/halt'),
      row('Panels the crew adds to this console (new)', 'Controls › Console panels', 'console-panel.js · company/console/'),
      row('Delete or archive a chat (new)', 'Comms', '/api/groups control delete')
    ];
    const defs = [['station', 'Station', station.length], ['company', 'Company layer', company.length]];
    return {
      eyebrow: [station.length + ' station places', company.length + ' company tools'],
      tabs: defs.map(([id, label, n]) => ({ label, n, sel: id === tab ? 'true' : 'false', pick: () => this.setState({ tab: id }),
        style: 'min-height: 44px; padding: 0 14px; border: 0; background: none; cursor: pointer; font: var(--type-label); color: ' + (id === tab ? 'var(--text-strong); box-shadow: inset 0 -2px 0 var(--accent);' : 'var(--text-muted);') })),
      h1: tab === 'station' ? 'Old station place' : 'Company feature',
      h3: tab === 'station' ? 'Station API' : 'Tool or file',
      rows: tab === 'station' ? station : company
    };
  }
}
</script>
</body>
</html>
