<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Work</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/fonts.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/colors.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/typography.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/spacing.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/effects.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/base.css">
<script src="ds/caphedesignsystem_e679e3/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--text-accent)}a:hover{color:var(--accent-hover)}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--bg-page); font-family: var(--font-sans); color: var(--text-body);">
  <div style="flex: 1 1 248px; max-width: 100%;">
    <dc-import name="Sidebar" active="work" hint-size="248px,1100px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 48px clamp(20px, 4vw, 56px) 64px; display: flex; flex-direction: column; gap: 36px;">
    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <x-import component-from-global-scope="CaPheDesignSystem_e679e3.Eyebrow" items="{{eyebrow}}"></x-import>
        <h1 style="font: var(--type-h1); letter-spacing: var(--tracking-heading);">Work.</h1>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <x-import component-from-global-scope="CaPheDesignSystem_e679e3.Button" variant="secondary">Recipes</x-import>
        <x-import component-from-global-scope="CaPheDesignSystem_e679e3.Button" variant="primary">New quest</x-import>
      </div>
    </header>

    <div role="tablist" aria-label="Work views" style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border-hairline);">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}} <span style="font: 400 12px/1 var(--font-mono); color: var(--text-subtle);">{{t.n}}</span></button>
      </sc-for>
    </div>

    <sc-if value="{{isQuests}}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px;">
        <sc-for list="{{columns}}" as="col" hint-placeholder-count="3">
          <section style="display: flex; flex-direction: column; gap: 12px;">
            <h2 style="font: var(--type-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-muted);">{{col.name}} · {{col.n}}</h2>
            <sc-for list="{{col.cards}}" as="q" hint-placeholder-count="3">
              <article style="display: flex; flex-direction: column; gap: 10px; padding: 18px; background: var(--surface-card); border: 1px solid var(--border-hairline); border-radius: var(--radius-lg);">
                <div style="display: flex; justify-content: space-between; gap: 8px;">
                  <span style="font: var(--type-mono); color: var(--text-muted);">{{q.id}}</span>
                  <span style="font: var(--type-caption); color: var(--text-muted);">{{q.owner}}</span>
                </div>
                <h3 style="font: var(--type-label); color: var(--text-strong); line-height: 1.35;">{{q.title}}</h3>
                <div role="img" aria-label="{{q.aria}}" style="position: relative; height: 4px; border-radius: var(--radius-pill); background: var(--bg-sunken); overflow: hidden;"><div style="{{q.bar}}"></div></div>
                <span style="font: var(--type-caption); color: var(--text-muted);">{{q.note}}</span>
              </article>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isHandoffs}}" hint-placeholder-val="{{ false }}">
      <div style="overflow-x: auto; border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); background: var(--surface-card);">
        <table style="width: 100%; min-width: 720px; border-collapse: collapse; font: var(--type-body-s);">
          <thead><tr style="text-align: left; color: var(--text-muted);">
            <th scope="col" style="padding: 14px 18px; font: var(--type-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase;">Deadline</th>
            <th scope="col" style="padding: 14px 18px; font: var(--type-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase;">From → to</th>
            <th scope="col" style="padding: 14px 18px; font: var(--type-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase;">Ask</th>
            <th scope="col" style="padding: 14px 18px; font: var(--type-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase;">Status</th>
          </tr></thead>
          <tbody>
            <sc-for list="{{handoffs}}" as="h" hint-placeholder-count="4">
              <tr style="border-top: 1px solid var(--border-hairline);">
                <td style="padding: 14px 18px; font: var(--type-mono); color: var(--text-strong); white-space: nowrap;">{{h.due}}</td>
                <td style="padding: 14px 18px; white-space: nowrap;">{{h.route}}</td>
                <td style="padding: 14px 18px; color: var(--text-strong);">{{h.ask}}</td>
                <td style="padding: 14px 18px;"><x-import component-from-global-scope="CaPheDesignSystem_e679e3.Tag" variant="status" status="{{h.status}}">{{h.state}}</x-import></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </sc-if>

    <sc-if value="{{isOther}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 28px; border: 1px dashed var(--border-default); border-radius: var(--radius-lg);">
        <h2 style="font: var(--type-h4);">{{otherTitle}}</h2>
        <p style="font: var(--type-body-s); color: var(--text-muted); max-width: 640px;">{{otherText}}</p>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'quests' }; }
  renderVals() {
    const tab = this.state.tab;
    const defs = [['quests', 'Quests', '7'], ['handoffs', 'Handoffs', '4'], ['tasks', 'Tasks', '9'], ['deliverables', 'Deliverables', '12'], ['review', 'To review', '2'], ['decisions', 'Decisions', '18'], ['projects', 'Projects', '1']];
    const other = {
      tasks: ['Tasks', 'Kanban of every agent task with owner and session; drag to reprioritise. Station: deliverables, line-jobs.'],
      deliverables: ['Deliverables', 'Every finished file, filterable by agent and project; preview, open, clean up with undo, rate an away run.'],
      review: ['To review', 'Away-work results waiting for Keep, Later or Discard, and quests attested but not yet closed.'],
      decisions: ['Decisions', 'company/work/decisions.md, newest first: who decided, what, why, with the decision right that applied.'],
      projects: ['Projects', 'Ownership records (project.js): request, scope, state. Only you approve or revoke a takeover.']
    };
    const bar = (pct) => 'position: absolute; inset: 0 auto 0 0; width: ' + pct + '%; background: var(--accent);';
    const q = (id, owner, title, done, of, note) => ({ id, owner, title, note, bar: bar(Math.round(done / of * 100)), aria: done + ' of ' + of + ' steps done' });
    return {
      eyebrow: ['7 quests', '4 open handoffs', '0 overdue'],
      tabs: defs.map(([id, label, n]) => ({ label, n, sel: id === tab ? 'true' : 'false', pick: () => this.setState({ tab: id }),
        style: 'min-height: 44px; padding: 0 14px; border: 0; background: none; cursor: pointer; font: var(--type-label); color: ' + (id === tab ? 'var(--text-strong); box-shadow: inset 0 -2px 0 var(--accent);' : 'var(--text-muted);') })),
      isQuests: tab === 'quests', isHandoffs: tab === 'handoffs', isOther: !!other[tab],
      otherTitle: (other[tab] || [])[0] || '', otherText: (other[tab] || [])[1] || '',
      columns: [
        { name: 'In progress', n: 3, cards: [
          q('q:34', 'Founder', 'Q1 plan from the charter', 2, 5, 'Next: pricing model'),
          q('q:36', 'June', 'Illinois non-compete research memo', 4, 5, 'Next: partner review'),
          q('q:37', 'Mira', 'Hire a paralegal', 3, 6, 'Interviews today') ] },
        { name: 'Blocked', n: 1, cards: [
          q('q:35', 'Teo', 'Matter intake tool', 1, 4, 'Waiting: client drive access (gate)') ] },
        { name: 'Attested', n: 2, cards: [
          q('q:31', 'Teo', 'Engagement letter template', 3, 3, 'Closed by the dispatcher on evidence'),
          q('q:33', 'Founder', 'Conflict-check procedure', 4, 4, 'Evidence: runbooks/conflicts.md') ] }
      ],
      handoffs: [
        { due: 'today 12:00', route: 'Founder → Mira', ask: 'Shortlist for the paralegal role', status: 'warning', state: 'Open' },
        { due: 'today 17:00', route: 'Teo → Founder', ask: 'Review dispatcher change hc-0003 (Risk is you)', status: 'warning', state: 'Open' },
        { due: '18 Nov', route: 'June → Founder', ask: 'Partner read of the non-compete memo', status: 'warning', state: 'Open' },
        { due: '—', route: 'Mira → Teo', ask: 'Desk for the new hire', status: 'neutral', state: 'Undated' }
      ]
    };
  }
}
</script>
</body>
</html>
