<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Abilities</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/fonts.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/colors.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/typography.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/spacing.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/effects.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/base.css">
<script src="ds/caphedesignsystem_e679e3/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--text-accent)}a:hover{color:var(--accent-hover)}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--bg-page); font-family: var(--font-sans); color: var(--text-body);">
  <div style="flex: 1 1 248px; max-width: 100%;">
    <dc-import name="Sidebar" active="abilities" hint-size="248px,1100px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 48px clamp(20px, 4vw, 56px) 64px; display: flex; flex-direction: column; gap: 32px;">
    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <x-import component-from-global-scope="CaPheDesignSystem_e679e3.Eyebrow" items="{{eyebrow}}"></x-import>
        <h1 style="font: var(--type-h1); letter-spacing: var(--tracking-heading);">Abilities.</h1>
        <p style="font: var(--type-body-l); color: var(--text-muted); max-width: 640px;">What the crew can reach. Each connector is checked against its recorded scope every tick.</p>
      </div>
      <x-import component-from-global-scope="CaPheDesignSystem_e679e3.Button" variant="primary">Connect</x-import>
    </header>

    <div role="tablist" aria-label="Abilities" style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border-hairline);">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="6">
        <article style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); background: var(--surface-card);">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
            <h2 style="font: var(--type-h4); letter-spacing: var(--tracking-h4);">{{i.name}}</h2>
            <x-import component-from-global-scope="CaPheDesignSystem_e679e3.Tag" variant="status" status="{{i.status}}">{{i.state}}</x-import>
          </div>
          <p style="font: var(--type-body-s); color: var(--text-muted);">{{i.what}}</p>
          <span style="font: var(--type-mono); color: var(--text-muted);">{{i.meta}}</span>
          <div style="display: flex; gap: 14px; margin-top: auto; font: var(--type-body-s);">
            <a href="Abilities.dc.html">{{i.a}}</a><a href="Abilities.dc.html">{{i.b}}</a>
          </div>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'connected' }; }
  renderVals() {
    const tab = this.state.tab;
    const sets = {
      connected: [
        { name: 'GitHub', status: 'online', state: 'In scope', what: 'Read-only through the MCP header. Merges go through the merge gate.', meta: '28 read tools · 0 write', a: 'Scope', b: 'Disconnect' },
        { name: 'Google Drive', status: 'warning', state: 'Waiting on you', what: 'Client drive, read-only, /Matters/2026. Requested by Risk.', meta: 'gate: access · q-0415', a: 'Review request', b: 'Details' },
        { name: 'CourtListener', status: 'online', state: 'In scope', what: 'Case law search API. Network clearance recorded.', meta: 'service key · 0600', a: 'Scope', b: 'Rotate key' },
        { name: 'Computer control', status: 'neutral', state: 'Off', what: 'Let an agent use this machine’s screen and keyboard.', meta: 'kill switch', a: 'Turn on', b: 'Who may' }
      ],
      skills: [
        { name: 'chain-of-command', status: 'online', state: 'Everyone', what: 'Ask up one level, not to the top.', meta: 'company skill', a: 'Edit', b: 'Agents' },
        { name: 'refusal-escalation', status: 'online', state: 'Everyone', what: 'Report a block in the one shape; never reword a T3.', meta: 'company skill', a: 'Edit', b: 'Agents' },
        { name: 'citation-check', status: 'warning', state: 'Proposed', what: 'Learned by June. Pre-screen clean; behaviour evaluation pending.', meta: 'People decides', a: 'Approve', b: 'Reject' },
        { name: 'Skill market', status: 'neutral', state: '214 listed', what: 'Install or share a skill; installs go to People for review.', meta: 'skill-market', a: 'Browse', b: 'Shared' }
      ],
      channels: [
        { name: 'Owner channel', status: 'online', state: 'File adapter', what: 'company/owner/inbound.jsonl and outbound.jsonl. One CEO question a day.', meta: 'pinned in the external gate', a: 'Open', b: 'Adapter' },
        { name: 'Telegram', status: 'neutral', state: 'Not paired', what: 'Pair a bot to reach the crew from your phone.', meta: 'channels/telegram', a: 'Pair', b: 'Bots' },
        { name: 'Slack', status: 'neutral', state: 'Not connected', what: 'Talk to agents in a workspace channel.', meta: 'channels/slack', a: 'Connect', b: 'Details' },
        { name: 'Discord, Matrix, Signal', status: 'neutral', state: 'Available', what: 'Same pairing flow; notify and hand off.', meta: 'channels/*', a: 'Connect', b: 'Details' }
      ],
      keys: [
        { name: 'Service API keys', status: 'online', state: '3 keys', what: 'Exposed to runs as environment variables, never printed.', meta: 'servicekeys', a: 'Add', b: 'Scrub' },
        { name: 'secrets/ folder', status: 'online', state: '5 files', what: 'station-token, minimax-key, deepseek-key, openrouter keys. 0600, not in git.', meta: 'co.secret(name)', a: 'Check', b: 'Rotate' }
      ],
      tools: [
        { name: 'Toolsets', status: 'online', state: '12 on', what: 'Per-toolset kill switches for the whole station.', meta: 'toolsets', a: 'Manage', b: 'History' },
        { name: 'Hooks and plugins', status: 'neutral', state: '2', what: 'Run code before or after a tool call.', meta: 'hooks, plugins', a: 'Manage', b: 'Add' },
        { name: 'Extensions', status: 'neutral', state: '0', what: 'Browser and desktop extensions.', meta: 'extensions', a: 'Browse', b: 'Add' }
      ],
      apps: [
        { name: 'Matter tracker', status: 'online', state: 'Live', what: 'An app the crew built from a description.', meta: 'apps · scheduled refresh', a: 'Open', b: 'Rename' },
        { name: 'New app', status: 'neutral', state: '', what: 'Describe an app and get it.', meta: 'apps/store', a: 'Describe', b: 'Examples' }
      ],
      browser: [
        { name: 'In-app browser', status: 'online', state: 'Ready', what: 'Watch or take over an agent’s browser (step in).', meta: 'browser/view', a: 'Open', b: 'Follow mode' },
        { name: 'Saved sign-ins', status: 'neutral', state: '2 sites', what: 'Sessions the crew may reuse.', meta: 'browser/signins', a: 'Manage', b: 'Forget all' }
      ]
    };
    const defs = [['connected', 'Connected'], ['skills', 'Skills'], ['channels', 'Channels'], ['keys', 'API keys'], ['tools', 'Tools'], ['apps', 'Apps'], ['browser', 'Browser']];
    return {
      eyebrow: ['3 connectors', '0 drift'],
      tabs: defs.map(([id, label]) => ({ label, sel: id === tab ? 'true' : 'false', pick: () => this.setState({ tab: id }),
        style: 'min-height: 44px; padding: 0 14px; border: 0; background: none; cursor: pointer; font: var(--type-label); color: ' + (id === tab ? 'var(--text-strong); box-shadow: inset 0 -2px 0 var(--accent);' : 'var(--text-muted);') })),
      items: sets[tab]
    };
  }
}
</script>
</body>
</html>
