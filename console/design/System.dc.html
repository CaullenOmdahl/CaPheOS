<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>System</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/fonts.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/colors.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/typography.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/spacing.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/effects.css">
<link rel="stylesheet" href="ds/caphedesignsystem_e679e3/tokens/base.css">
<script src="ds/caphedesignsystem_e679e3/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--text-accent)}a:hover{color:var(--accent-hover)}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--bg-page); font-family: var(--font-sans); color: var(--text-body);">
  <div style="flex: 1 1 248px; max-width: 100%;">
    <dc-import name="Sidebar" active="system" hint-size="248px,1100px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 48px clamp(20px, 4vw, 56px) 64px; display: flex; flex-direction: column; gap: 36px;">
    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <x-import component-from-global-scope="CaPheDesignSystem_e679e3.Eyebrow" items="{{eyebrow}}"></x-import>
        <h1 style="font: var(--type-h1); letter-spacing: var(--tracking-heading);">System.</h1>
      </div>
      <x-import component-from-global-scope="CaPheDesignSystem_e679e3.Button" variant="secondary">Copy diagnostics</x-import>
    </header>

    <section aria-labelledby="halt" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 28px; border-radius: var(--radius-lg); background: var(--bg-inverse); color: var(--text-on-inverse);">
      <div style="display: flex; flex-direction: column; gap: 6px; max-width: 640px;">
        <h2 id="halt" style="font: var(--type-h4); color: var(--text-on-inverse);">Stop the company</h2>
        <p style="font: var(--type-body-s); color: var(--text-on-inverse-muted);">Soft halt starts nothing new and lets running work finish through each seat's shutdown procedure. Hard halt cuts every run off now.</p>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <x-import component-from-global-scope="CaPheDesignSystem_e679e3.Button" variant="inverse" href="Halt.dc.html">Soft halt</x-import>
        <a href="Halt.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: var(--radius-md); background: var(--status-danger); color: #FFFFFF; font: var(--type-label);">Hard halt</a>
      </div>
    </section>

    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
        <article style="display: flex; flex-direction: column; gap: 12px; padding: 22px; border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); background: var(--surface-card);">
          <h2 style="font: var(--type-h4); letter-spacing: var(--tracking-h4);">{{g.title}}</h2>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;">
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
              <li style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border-hairline); font: var(--type-body-s);">
                <a href="System.dc.html" style="color: var(--text-strong);">{{r.a}}</a>
                <span style="font: var(--type-mono); color: var(--text-muted); text-align: right;">{{r.b}}</span>
              </li>
            </sc-for>
          </ul>
        </article>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (a, b) => ({ a, b });
    return {
      eyebrow: ['StarNet 0.15.0', 'CaPheOS framework'],
      groups: [
        { title: 'Company', rows: [r('Company profile', 'company.json'), r('Charter', 'CHARTER.md'), r('Decision rights', 'DECISION_RIGHTS.md'), r('Timezone', 'America/Chicago'), r('Owner channel', 'file adapter')] },
        { title: 'You', rows: [r('About you', 'profile'), r('Aims', '3 goals'), r('Preferences', 'plain, brief'), r('Agent briefing', 'what every agent sees'), r('Sources', '2 linked')] },
        { title: 'Health', rows: [r('Station API', 'ok · 12 ms'), r('Dispatcher', 'ok · 4 min ago'), r('Tool integrity', '48 of 48 parse'), r('Quests nothing can close', '0'), r('Incidents', '0 open')] },
        { title: 'Spending limits', rows: [r('Metered cap', '$3.00 / day'), r('Per agent', '$1.00 / day'), r('Station soft rail', '$25 / day'), r('Settle and resume', 'budget/*')] },
        { title: 'App and backup', rows: [r('Export config', 'config/export'), r('Recovery bundle', 'last 02:00'), r('Company folder history', 'hourly'), r('Updates', 'up to date'), r('Erase station', 'asks twice')] },
        { title: 'Look, sound and alerts', rows: [r('Theme', 'Light'), r('Notifications', 'gates only'), r('Voice', 'push to talk · local'), r('Remote devices', '1 phone paired'), r('Field manual', 'help')] }
      ]
    };
  }
}
</script>
</body>
</html>
