name: ci

# GitHub-hosted CI is off: the owner pays for Actions minutes and runs the suite
# on their own machine (`bash scripts/test.sh`). Run it here by hand only if needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Offline test suite (no station, no secrets)
        run: bash scripts/test.sh
