# One compose project per company. The image is immutable; the company is the data volume.
#
#   COMPANY_SLUG=example TZ=America/Chicago docker compose -f capheos.yml up -d
#
# Put TLS in front of the console before it is reachable from another machine.
# The updater bridge is host-side and never gets a Docker socket (docs/DEPLOY.md §2).
name: capheos-${COMPANY_SLUG:-company}

services:
  capheos:
    image: ${CAPHEOS_IMAGE:-ghcr.io/capheos/capheos}:${CAPHEOS_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:exec
      - /tmp:size=64m        # bounded: the company's temp files live on the data volume (TMPDIR below), not in RAM
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8901}:8901"
    environment:
      TZ: ${TZ:-UTC}
      CAPHEOS_ROOT: /app
      CAPHEOS_DATA: /data
      TMPDIR: /data/tmp
      CONSOLE_HOST: 0.0.0.0
      CONSOLE_PORT: "8901"
    volumes:
      - capheos-data:/data
    # a memory cap for the whole container: `node company/tools/memory.js plan --total <MB of the machine>` gives the
    # numbers (the station's max plus about 1 GB for the console and its jobs). E.g. a 4 GB machine: 3g. Leave it out to
    # let memory.js and the kernel decide; the in-container heap comes from .starnet-data/memory.env (memory.js apply).
    # mem_limit: 3g
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  capheos-data:
    name: capheos-${COMPANY_SLUG:-company}-data
